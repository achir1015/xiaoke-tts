name: App 建置、測試與發佈（Windows／Mac／Android）

# 推到 main 且 version.json 的版本還沒發佈過：檢查 → Windows、Mac 打包並安裝後自我測試、Android 建置 APK → 通過後發佈 GitHub Release
# 版本已發佈過：只測試；Android APK 會直接補上（覆蓋）到那個版本的 Release
on:
  push:
    branches: [main]
    paths: ['index.html', 'version.json', 'sw.js', 'css/**', 'js/**', 'vendor/**', 'icons/**', 'voices/**', 'samples/**', 'desktop/**', 'android/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: 檢查版本號與語法
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      released: ${{ steps.ver.outputs.released }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 版本號一致、是否已發佈
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c 'import json;print(json.load(open("version.json"))["version"])')
          grep -q "export const APP_VERSION = \"$V\";" js/version.js || { echo "::error::js/version.js 的 APP_VERSION 和 version.json（$V）不一致"; exit 1; }
          grep -q "xiaoke-tts-v$V" sw.js || { echo "::error::sw.js 的快取名稱沒有更新成 v$V"; exit 1; }
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "released=yes" >> "$GITHUB_OUTPUT"; echo "v$V 已經發佈過，只測試不發佈"; else echo "released=no" >> "$GITHUB_OUTPUT"; fi
      - name: JavaScript 與 Python 語法
        run: |
          mkdir -p /tmp/chk
          for f in js/*.js; do cp "$f" /tmp/chk/$(basename "$f" .js).mjs; node --check /tmp/chk/$(basename "$f" .js).mjs || exit 1; done
          node --check sw.js
          python3 -m py_compile desktop/app.py tools/sync_voices.py tools/make_icons.py android/build.py

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 打包（PyInstaller＋Inno Setup）
        working-directory: desktop
        shell: pwsh
        run: ./build_windows.ps1
      - name: 靜默安裝
        shell: pwsh
        run: |
          function Note($title, $text) { $t = ($text | Out-String) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'; Write-Host "::warning title=$title::$t" }
          New-Item -ItemType Directory C:\KKTest -Force | Out-Null
          $setup = Get-ChildItem dist-installer\*.exe | Select-Object -First 1
          Note '安裝檔' "$($setup.Name) $([math]::Round($setup.Length/1MB,1)) MB"
          $dir = 'C:\KKTest\XiaokeTTS'
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$dir`" /LOG=`"C:\KKTest\install.log`"" -Wait -PassThru
          if (-not (Test-Path "$dir\XiaokeTTS.exe")) { if (Test-Path C:\KKTest\install.log) { Note '安裝紀錄' (Get-Content C:\KKTest\install.log -Tail 30) }; throw '找不到安裝後的執行檔' }
      - name: 安裝後自我測試
        shell: pwsh
        run: |
          function Note($title, $text) { $t = ($text | Out-String) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'; Write-Host "::warning title=$title::$t" }
          New-Item -ItemType Directory C:\KKTest\out -Force | Out-Null
          $p = Start-Process -FilePath 'C:\KKTest\XiaokeTTS\XiaokeTTS.exe' -ArgumentList '--selftest C:\KKTest\out\report.json' -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process $p -Force }
          if (-not (Test-Path C:\KKTest\out\report.json)) { throw '沒有產生測試報告' }
          $r = Get-Content C:\KKTest\out\report.json -Raw -Encoding UTF8
          Note '自我測試報告（Windows）' $r
          if (-not ($r | ConvertFrom-Json).ok) { throw '自我測試未通過' }
      - name: 解除安裝
        if: always()
        shell: pwsh
        run: if (Test-Path C:\KKTest\XiaokeTTS\unins000.exe) { Start-Process C:\KKTest\XiaokeTTS\unins000.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait }
      - name: 收集結果
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory test-output -Force | Out-Null
          Copy-Item C:\KKTest\out\*.json, C:\KKTest\out\*.png test-output\ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: |
            dist-installer/*.exe
            test-output/

  mac:
    name: Mac（${{ matrix.arch }}）
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, arch: AppleSilicon }
          - { os: macos-15-intel, arch: Intel }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.arch == 'Intel' }}   # GitHub 的 Intel Mac 逐步淘汰，不擋住發佈
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 安裝套件、準備網頁與圖示
        working-directory: desktop
        run: |
          python -m pip install -r requirements.txt
          mkdir -p web && cp ../index.html ../version.json ../sw.js ../manifest.webmanifest ../favicon.ico ../favicon-32.png ../favicon-16.png ../apple-touch-icon.png web/
          cp -R ../css ../js ../vendor ../icons ../voices ../samples web/
          mkdir -p app.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s ../icons/icon-1024.png --out app.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d ../icons/icon-1024.png --out app.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns app.iconset -o app.icns
      - name: PyInstaller 打包成 .app
        working-directory: desktop
        run: |
          python -m PyInstaller $(cat pyinstaller_args.txt | tr '\n' ' ') --icon app.icns --add-data "web:web" \
            --osx-bundle-identifier org.achir1015.xiaoketts --distpath ../dist --workpath ../build app.py
          cd ../dist
          APP="小柯機器人台灣語音 MP3 工具.app"
          mv XiaokeTTS.app "$APP"
          P="$APP/Contents/Info.plist"
          V=${{ needs.check.outputs.ver }}
          plutil -replace CFBundleDisplayName -string "小柯機器人台灣語音 MP3 工具" "$P"
          plutil -replace CFBundleShortVersionString -string "$V" "$P"
          plutil -replace CFBundleVersion -string "$V" "$P"
          plutil -replace NSHighResolutionCapable -bool true "$P"
          plutil -replace NSMicrophoneUsageDescription -string "錄製自己的聲音範本" "$P"
          codesign --force --deep -s - "$APP"
          du -sh "$APP"
      - name: 自我測試
        continue-on-error: true
        env:
          QTWEBENGINE_DISABLE_SANDBOX: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/kk" test-output
          "dist/小柯機器人台灣語音 MP3 工具.app/Contents/MacOS/XiaokeTTS" --selftest "$RUNNER_TEMP/kk/report.json" &
          PID=$!
          for i in $(seq 1 150); do [ -f "$RUNNER_TEMP/kk/report.json" ] && break; sleep 2; done
          sleep 3; kill $PID 2>/dev/null || true
          cp "$RUNNER_TEMP"/kk/*.json "$RUNNER_TEMP"/kk/*.png test-output/ 2>/dev/null || true
          [ -f test-output/report.json ] || { echo "::error::沒有產生測試報告"; exit 1; }
          python3 - <<'EOF'
          import json
          r = json.load(open('test-output/report.json', encoding='utf-8'))
          for s in r.get('web', {}).get('steps', []):
              print(('✔ ' if s['ok'] else '✘ ') + s['name'] + '：' + s['info'][:200])
          print('mp3_ok', r.get('mp3_ok'))
          if not r.get('ok'):
              print('::warning title=Mac ${{ matrix.arch }} 自我測試::未通過')
              raise SystemExit(1)
          EOF
      - name: 製作 .dmg
        run: |
          mkdir dmg
          ditto "dist/小柯機器人台灣語音 MP3 工具.app" "dmg/小柯機器人台灣語音 MP3 工具.app"
          ln -s /Applications dmg/Applications
          cp desktop/MAC_README.txt "dmg/第一次開啟請看這裡.txt"
          for n in 1 2 3 4 5; do
            hdiutil create -volname "小柯機器人台灣語音 MP3 工具" -srcfolder dmg -ov -format UDZO "XiaokeTTS-mac-${{ matrix.arch }}-${{ needs.check.outputs.ver }}.dmg" && break
            echo "hdiutil 第 $n 次失敗，稍後重試"; sleep 15
          done
          ls -lh *.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-${{ matrix.arch }}
          path: |
            *.dmg
            test-output/

  android:
    name: Android
    needs: check
    runs-on: ubuntu-latest
    env:
      # 簽章憑證的 SHA-256（公開資訊）：每次都要用同一把金鑰，手機上的 App 才能直接更新
      CERT_SHA256: 559772f1a3b59c917d1e262e5a4cc4b2f95078fe929f26a02cdb0b77344cdf24
      APK: XiaokeTTS-Android-${{ needs.check.outputs.ver }}.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: 簽章金鑰（repo Secret：ANDROID_KEYSTORE_B64）
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          [ -n "$KS" ] || { echo "::error::缺少 ANDROID_KEYSTORE_B64 Secret"; exit 1; }
          echo "$KS" | base64 -d > android/xiaoketts.jks
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: 建置 APK
        run: |
          python3 android/build.py
          mv android/build/XiaokeTTS.apk "$APK"
          ls -lh "$APK"
      - name: 確認簽章與版本
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          FP=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          [ "$FP" = "$CERT_SHA256" ] || { echo "::error::APK 簽章和手機上的 App 不一樣（$FP），裝了會無法更新"; exit 1; }
          "$BT/aapt2" dump badging "$APK" | grep -m1 "versionName='${{ needs.check.outputs.ver }}'" || { echo "::error::APK 版本號不對"; exit 1; }
          rm -f android/xiaoketts.jks
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ env.APK }}
      - name: 已發佈的版本：直接補上 APK
        if: needs.check.outputs.released == 'yes' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.check.outputs.ver }}" "$APK" --clobber --repo "$GITHUB_REPOSITORY"

  release:
    name: 發佈到 GitHub Releases
    needs: [check, windows, mac, android]
    if: success() && github.ref == 'refs/heads/main' && needs.check.outputs.released == 'no'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: 整理檔案與說明
        run: |
          mkdir release
          cp artifacts/windows/dist-installer/*.exe release/
          cp artifacts/mac-*/*.dmg release/ 2>/dev/null || true
          cp artifacts/android/*.apk release/
          ls -lh release
          python3 - <<'EOF'
          import json
          j = json.load(open('version.json', encoding='utf-8'))
          body = f"## v{j['version']} 更新內容\n\n" + "\n".join(f"- {n}" for n in j['notes']) + "\n\n" + open('desktop/RELEASE_NOTES.md', encoding='utf-8').read()
          open('release-body.md', 'w', encoding='utf-8').write(body)
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.ver }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: 小柯機器人台灣語音 MP3 工具 v${{ needs.check.outputs.ver }}
          body_path: release-body.md
          files: release/*
